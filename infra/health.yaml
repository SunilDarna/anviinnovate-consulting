AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Healthspan blueprint site (health.<domain>) — S3 + CloudFront + OAC + ACM + Route53.

  Deliberately a SEPARATE stack from `anviinnovate`: this is static content with its
  own lifecycle, so shipping it must never produce a changeset against the production
  Lambdas, HTTP API or SES identity. Same resource idiom as the AcademyBucket /
  AcademyDistribution block in template.yaml, so the two read alike.

Parameters:
  DomainName:
    Type: String
    Default: anviinnovate.com
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for DomainName. Passed at deploy time.
  Subdomain:
    Type: String
    Default: health
  ApiDomain:
    Type: String
    Default: ""
    Description: execute-api domain of the anviinnovate-health-api stack (empty = no /api mount)

Conditions:
  HasApi: !Not [!Equals [!Ref ApiDomain, ""]]

Resources:
  HealthBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "anviinnovate-health-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  HealthCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "${Subdomain}.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "${Subdomain}.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  # S3+OAC origins don't serve sub-path index documents (same issue the main
  # stack hit — see anvi-dir-index-rewrite). Rewrite /app -> /app/index.html etc.
  # Attached to the DEFAULT behavior only, so /api/* is untouched.
  HealthRewriteFn:
    Type: AWS::CloudFront::Function
    Properties:
      Name: health-dir-index-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: rewrite directory paths to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          if (uri.endsWith('/')) { req.uri = uri + 'index.html'; }
          else if (!uri.split('/').pop().includes('.')) { req.uri = uri + '/index.html'; }
          return req;
        }

  HealthOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: anvi-health-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  HealthDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases:
          - !Sub "${Subdomain}.${DomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref HealthCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: HealthOrigin
            DomainName: !GetAtt HealthBucket.RegionalDomainName
            OriginAccessControlId: !Ref HealthOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
          - !If
            - HasApi
            - Id: ApiOrigin
              DomainName: !Ref ApiDomain
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue
        CacheBehaviors:
          - !If
            - HasApi
            - PathPattern: "/api/*"
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: HealthOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true                                                    # 486 KB of HTML -> ~90 KB on the wire
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6                # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03      # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt HealthRewriteFn.FunctionMetadata.FunctionARN
        # PriceClass_200 (not _100 like the academy) so Indian edge locations are in
        # play — the reader is in Hyderabad, and CloudFront's 1 TB/month free tier
        # applies regardless of price class, so this costs nothing extra.
        PriceClass: PriceClass_200

  HealthBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref HealthBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${HealthBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${HealthDistribution}"

  HealthA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${Subdomain}.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt HealthDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # fixed CloudFront zone ID
        EvaluateTargetHealth: false

  HealthAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${Subdomain}.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt HealthDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  HealthUrl:
    Description: Healthspan blueprint URL
    Value: !Sub "https://${Subdomain}.${DomainName}"
  HealthBucketName:
    Description: S3 bucket for the healthspan site
    Value: !Ref HealthBucket
  HealthDistributionId:
    Description: CloudFront distribution ID — used for cache invalidation on redeploy.
    Value: !Ref HealthDistribution
