AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap: GitHub Actions OIDC provider + deploy role for
  SunilDarna/anviinnovate-consulting. Deploy once, then put the RoleArn output
  into the GitHub repo secret AWS_ROLE_ARN.

Parameters:
  GitHubOrg:
    Type: String
    Default: SunilDarna
  GitHubRepo:
    Type: String
    Default: anviinnovate-consulting
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to "false" if this account already has the GitHub OIDC provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bba010962f5466c41cdf2e9e6dab0f
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: anviinnovate-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOIDCProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation / SAM deploys
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - s3:*
                  - cloudfront:*
                  - lambda:*
                  - apigateway:*
                  - dynamodb:*
                  - ses:*
                  - ssm:*
                  - route53:*
                  - acm:*
                  - logs:*
                Resource: "*"
              # SAM needs to create/pass execution roles for the Lambdas
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:CreateOpenIDConnectProvider
                Resource: "*"

Outputs:
  RoleArn:
    Description: Put this into GitHub repo secret AWS_ROLE_ARN.
    Value: !GetAtt GitHubActionsRole.Arn
